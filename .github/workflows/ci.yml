name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"         # pgserver has wheels for Python 3.9 to 3.12 only; the image runs 3.13
      - uses: actions/setup-node@v4     # tests/test_look.py syntax-checks the page scripts with node
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt pytest pgserver   # pgserver: a throwaway Postgres for the tests that need one
      - name: Compile
        run: python -m compileall -q cards
      - name: Tests
        run: pytest -q
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64 + arm64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
