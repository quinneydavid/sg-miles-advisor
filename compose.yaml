# sg-miles-advisor on one machine: Postgres + the app, one person, no login.
# Copy .env.example to .env first and set PGPASSWORD. The app listens on 127.0.0.1:8080 only.
# `docker compose up -d` uses the published image; `docker compose up -d --build` builds it from this checkout.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cards
      POSTGRES_USER: cards
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cards -d cards"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates the tables and loads the sample of hand-checked cards. Safe to run on every start.
  seed:
    image: ghcr.io/quinneydavid/sg-miles-advisor:latest
    build: .
    command: ["seed"]
    env_file: .env
    environment: &app-env
      PGHOST: db
      PGSSLMODE: disable
      CARDS_KEY_FILE: /keys/cards.key
    volumes:
      - keys:/keys
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/quinneydavid/sg-miles-advisor:latest
    build: .
    command: ["web"]
    env_file: .env
    environment: *app-env
    volumes:
      - keys:/keys
      - inbox:/inbox
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Reads each person's mailbox (set on the Settings page) and the drop folder every 15 minutes.
  ingest:
    image: ghcr.io/quinneydavid/sg-miles-advisor:latest
    build: .
    command: ["ingest", "--every", "15"]
    env_file: .env
    environment: *app-env
    volumes:
      - keys:/keys
      - inbox:/inbox
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db:
  keys:      # the key that wraps the data keys. Back it up apart from the database.
  inbox:
